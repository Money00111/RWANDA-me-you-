<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP - RWANDA Me&You</title>

<link rel="stylesheet" href="css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

  <div class="logo">
    <i class="fa-solid fa-shield-halved"></i>
  </div>

  <h1>Verify <span>Code</span></h1>

  <p class="subtitle">Enter the 6-digit code sent to your phone</p>

  <form id="otpForm">

    <input id="otpInput" type="text" maxlength="6"
    placeholder="Enter OTP code"
    style="
      width:100%;
      padding:14px;
      font-size:18px;
      text-align:center;
      border-radius:12px;
      border:1px solid #ccc;
      outline:none;
      margin-top:15px;
    ">

    <button class="btn primary" type="submit">
      Verify Code
    </button>

  </form>

</div>

<script type="module" src="js/otp.js"></script>

</body>
  </html>
