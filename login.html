<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | RWANDA Me&You</title>

<link rel="stylesheet" href="css/auth.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="background">

<div class="blue"></div>
<div class="yellow"></div>
<div class="green"></div>

</div>

<div class="login-card">

<div class="logo">

<i class="fa-solid fa-comments"></i>

</div>

<h1>RWANDA <span>Me&You</span></h1>

<p class="welcome">

Welcome! Enter your Rwanda phone number to continue.

</p>

<form id="loginForm">

<label>

<i class="fa-solid fa-phone"></i>

Phone Number

</label>

<div class="phone-box">

<span class="country">

🇷🇼 +250

</span>

<input

type="tel"

id="phone"

placeholder="7XXXXXXXX"

maxlength="9"

required

>

</div>

<div id="recaptcha-container"></div>

<button
type="submit"
class="login-btn"
id="sendCode">

<i class="fa-solid fa-paper-plane"></i>

Send Verification Code

</button>

</form>

<div class="divider">

<span>or</span>

</div>

<button class="guest-btn">

<i class="fa-solid fa-user"></i>

Continue as Guest

</button>

<div class="terms">

<p>

By continuing you agree to our

<a href="#">Terms</a>

and

<a href="#">Privacy Policy</a>

</p>

</div>

</div>

<script src="js/auth.js"></script>

</body>

  </html>
