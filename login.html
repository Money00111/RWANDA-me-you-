<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RWANDA Me&You - Login</title>

<link rel="stylesheet" href="css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/css/intlTelInput.css">

</head>

<body>

<div class="login-card">

<div class="logo">
<i class="fa-solid fa-comments"></i>
</div>

<h1>RWANDA <span>Me&You</span></h1>

<p class="welcome">Connect with people around the world</p>

<form id="loginForm">

<label>Phone Number</label>

<div class="phone-box">
<input id="phone" type="tel" placeholder="Enter phone number">
</div>

<div id="recaptcha-container"></div>

<button id="sendCode" class="login-btn" type="submit">
Send Code
</button>

</form>

<button id="guestBtn" class="guest-btn">
Continue as Guest
</button>

</div>

<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/js/intlTelInput.min.js"></script>

<script type="module" src="js/auth.js"></script>

</body>
  </html>
