<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Create Profile - Me&You
</title>


<link rel="stylesheet" href="profile.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<div class="profile-card">


<div class="logo">

<i class="fa-solid fa-user"></i>

</div>


<h1>
Complete Profile
</h1>


<p>
Tell people more about yourself.
</p>



<form id="profileForm">



<div class="input-box">

<i class="fa-solid fa-calendar"></i>

<input
id="age"
type="number"
placeholder="Age"
required>

</div>




<div class="input-box">

<i class="fa-solid fa-venus-mars"></i>


<select id="gender" required>

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>


<option value="Female">
Female
</option>


</select>

</div>




<div class="input-box">

<i class="fa-solid fa-globe"></i>

<input
id="country"
type="text"
placeholder="Country"
required>

</div>




<div class="input-box">

<i class="fa-solid fa-location-dot"></i>

<input
id="city"
type="text"
placeholder="City"
required>

</div>




<div class="input-box">

<textarea

id="bio"

placeholder="Write something about yourself">

</textarea>

</div>



<div class="photo-box">


<img
id="profilePreview"
src="../../assets/default-avatar.png"
alt="Profile">


<input
type="file"
id="photoInput"
accept="image/*">


  </div>

<div class="input-box">

<input

id="interests"

type="text"

placeholder="Interests (Music, Sport, Travel)">

</div>





<button type="submit" id="saveBtn">

Continue

</button>



</form>


</div>



<script type="module" src="profile.js"></script>


</body>

  </html>
