<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Create Account - Me&You
</title>


<link rel="stylesheet"
href="../../assets/css/variables.css">


<link rel="stylesheet"
href="register.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<div class="register-container">


<div class="logo">
<i class="fa-solid fa-heart"></i>
</div>


<h1>
Me<span>&You</span>
</h1>


<p>
Create your account and meet new people.
</p>



<form id="registerForm">


<div class="input-box">

<i class="fa-solid fa-user"></i>

<input

id="name"

type="text"

placeholder="Full Name"

required>

</div>




<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input

id="email"

type="email"

placeholder="Email"

required>

</div>





<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input

id="password"

type="password"

placeholder="Password"

required>



<button

type="button"

class="show-password"

data-id="password">

<i class="fa-solid fa-eye"></i>

</button>


</div>





<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input

id="confirmPassword"

type="password"

placeholder="Confirm Password"

required>



<button

type="button"

class="show-password"

data-id="confirmPassword">

<i class="fa-solid fa-eye"></i>

</button>


</div>





<label class="terms">


<input

type="checkbox"

id="terms"

required>



<span>

I agree to Terms & Privacy Policy

</span>


</label>





<button

id="registerBtn"

type="submit">


Create Account


</button>




</form>




<p class="bottom-text">


Already have account?


<a href="../login/login.html">

Login

</a>


</p>



</div>




<script

type="module"

src="register.js">

</script>


</body>

</html>
