<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Login - RWANDA Me&You
</title>


<link rel="stylesheet" href="login.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<div class="login-card">


<div class="logo">

<i class="fa-solid fa-heart"></i>

</div>


<h1>

RWANDA <span>Me&You</span>

</h1>


<p>

Login and continue connecting.

</p>



<form id="loginForm">


<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input

id="email"

type="email"

placeholder="Email"

required>

</div>




<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input

id="password"

type="password"

placeholder="Password"

required>


<button

type="button"

id="showPassword">

<i class="fa-solid fa-eye"></i>

</button>


</div>




<button

type="submit"

id="loginBtn">

Login

</button>



</form>




<a href="../forgot-password/forgot-password.html">

Forgot Password?

</a>



<p>

Don't have account?

<a href="../register/register.html">

Register

</a>

</p>



</div>



<script type="module" src="login.js"></script>


</body>

</html>
