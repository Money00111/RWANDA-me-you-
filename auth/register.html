<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RWANDA Me&You - Register</title>

<link rel="stylesheet" href="auth.css">

</head>


<body>


<div class="box">

<h1>
RWANDA <span>Me&You</span>
</h1>


<h2>Create Account</h2>


<form id="registerForm">


<input 
id="name"
type="text"
placeholder="Full Name"
required>


<input 
id="email"
type="email"
placeholder="Email"
required>


<input 
id="password"
type="password"
placeholder="Password"
required>


<input 
id="confirmPassword"
type="password"
placeholder="Confirm Password"
required>


<label>

<input 
type="checkbox"
id="terms"
required>

I agree to Terms

</label>


<button type="submit">

Create Account

</button>


</form>


<p>

Already have account?

<a href="login.html">
Login
</a>

</p>


</div>


<script 
type="module"
src="auth.js">
</script>


</body>

</html>
